<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314" width="164" height="314">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4f5dff" />
      <stop offset="0.5" stop-color="#9b55ff" />
      <stop offset="1" stop-color="#ff7ac6" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1e2a" />
      <stop offset="1" stop-color="#050509" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffb0" />
      <stop offset="1" stop-color="#3ddc84" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1a0040" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="164" height="314" fill="url(#bg)" />
  <rect width="164" height="314" fill="url(#glow)" />
  <path d="M0 0 H164 V120 C120 96 50 100 0 140 Z" fill="#fff" opacity="0.07" />

  <!-- the island -->
  <g filter="url(#shadow)">
    <rect x="22" y="92" width="92" height="38" rx="19" fill="url(#pill)" />
    <circle cx="136" cy="111" r="13" fill="url(#pill)" />
  </g>
  <rect x="22.5" y="92.5" width="91" height="37" rx="18.5" fill="none" stroke="url(#rim)" stroke-width="1" />
  <circle cx="136" cy="111" r="12.5" fill="none" stroke="url(#rim)" stroke-width="1" />
  <g fill="url(#bar)">
    <rect x="38" y="105" width="5" height="12" rx="2.5" />
    <rect x="47" y="100" width="5" height="22" rx="2.5" />
    <rect x="56" y="96" width="5" height="30" rx="2.5" />
    <rect x="65" y="102" width="5" height="18" rx="2.5" />
    <rect x="74" y="98" width="5" height="26" rx="2.5" />
    <rect x="83" y="104" width="5" height="14" rx="2.5" />
    <rect x="92" y="107" width="5" height="8" rx="2.5" />
  </g>
  <circle cx="136" cy="111" r="6.5" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2.2" />
  <path d="M136 104.5 A6.5 6.5 0 1 1 130 113" fill="none" stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round" />

  <!-- name -->
  <text x="22" y="196" font-family="Segoe UI Semibold, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#fff">Dynamic</text>
  <text x="22" y="220" font-family="Segoe UI Semibold, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#fff">Island</text>
  <rect x="22" y="234" width="28" height="3" rx="1.5" fill="#fff" opacity="0.85" />
  <text x="22" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#fff" opacity="0.85">Your desktop,</text>
  <text x="22" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#fff" opacity="0.85">alive.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160" font-family="'Segoe UI', -apple-system, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a14" />
      <stop offset="0.55" stop-color="#6b4220" />
      <stop offset="1" stop-color="#a8642e" />
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="160" rx="20" /></clipPath>
    <clipPath id="chargeClip"><rect x="250" y="40" width="300" height="44" rx="22" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="160" fill="url(#wall)" />

    <!-- the island: idle pill, widens for a volume alert, then for a charging alert -->
    <rect y="40" height="44" rx="22" fill="#050509" stroke="#ffffff" stroke-opacity="0.08">
      <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.06;.11;.13;.42;.47;.55;.6;.62;.88;.93;1" keySplines=".3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1" values="140;140;336;320;320;140;140;314;300;300;140;140" />
      <animate attributeName="x" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.06;.11;.13;.42;.47;.55;.6;.62;.88;.93;1" keySplines=".3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1;.3 0 .2 1" values="330;330;232;240;240;330;330;243;250;250;330;330" />
    </rect>

    <!-- volume -->
    <g>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.12;.15;.4;.42;1" values="0;0;1;1;0;0" />
      <path d="M262 57 h6 l8 -7 v24 l-8 -7 h-6 z" fill="#ffffff" />
      <path d="M281 55 q5 7 0 14 M285 51 q9 11 0 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <g fill="#ffffff">
        <rect x="300" y="59" width="200" height="6" rx="3" fill-opacity="0.15" />
        <rect x="300" y="59" height="6" rx="3">
          <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.17;.24;1" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1" values="80;80;140;140" />
        </rect>
      </g>
      <g font-size="13" font-weight="600" fill="#ffffff" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">
        <text x="512" y="67"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.24;1" values="1;0;0" />40%</text>
        <text x="512" y="67" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.24;1" values="0;1;0" />70%</text>
      </g>
    </g>

    <!-- charging, with progress along the bottom edge -->
    <g>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.61;.64;.86;.88;1" values="0;0;1;1;0;0" />
      <path d="M276 50 l-9 14 h7 l-3 11 l10 -15 h-7 z" fill="#4ade80" />
      <text x="294" y="67" font-size="14" font-weight="600" fill="#ffffff">Charging</text>
      <text x="532" y="67" text-anchor="end" font-size="13" font-weight="600" fill="#4ade80" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">82%</text>
      <g clip-path="url(#chargeClip)">
        <rect x="250" y="80" height="4" fill="#4ade80">
          <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.62;.75;1" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1" values="0;0;246;246" />
        </rect>
      </g>
    </g>

    <text x="400" y="122" text-anchor="middle" font-size="13" fill="#ffffff" fill-opacity="0.7">Volume, brightness, battery and downloads show up as quick alerts</text>
  </g>
</svg>

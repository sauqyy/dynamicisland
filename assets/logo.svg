<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff" />
      <stop offset="0.55" stop-color="#a45bff" />
      <stop offset="1" stop-color="#ff7ac6" />
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d28" />
      <stop offset="1" stop-color="#050509" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95" />
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffb0" />
      <stop offset="1" stop-color="#3ddc84" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#1a0040" flood-opacity="0.45" />
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232" /></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)" />
    <rect width="1024" height="1024" fill="url(#glow)" />

    <!-- the island: a pill hanging in the middle, with its little timer bubble -->
    <g filter="url(#shadow)">
      <rect x="132" y="402" width="640" height="220" rx="110" fill="url(#pill)" />
      <circle cx="858" cy="512" r="74" fill="url(#pill)" />
    </g>
    <rect x="133.5" y="403.5" width="637" height="217" rx="108.5" fill="none" stroke="url(#rim)" stroke-width="3" />
    <circle cx="858" cy="512" r="72.5" fill="none" stroke="url(#rim)" stroke-width="3" />

    <!-- equalizer bars -->
    <g fill="url(#bar)">
      <rect x="300" y="477" width="28" height="70" rx="14" />
      <rect x="346" y="448" width="28" height="128" rx="14" />
      <rect x="392" y="424" width="28" height="176" rx="14" />
      <rect x="438" y="456" width="28" height="112" rx="14" />
      <rect x="484" y="436" width="28" height="152" rx="14" />
      <rect x="530" y="466" width="28" height="92" rx="14" />
      <rect x="576" y="482" width="28" height="60" rx="14" />
    </g>

    <!-- timer ring in the bubble -->
    <circle cx="858" cy="512" r="38" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="12" />
    <path d="M858 474 A38 38 0 1 1 821 521" fill="none" stroke="#3ddc84" stroke-width="12" stroke-linecap="round" />

    <!-- specular highlight on the tile -->
    <path d="M0 0 H1024 V300 C760 220 300 240 0 420 Z" fill="#fff" opacity="0.08" />
  </g>
</svg>

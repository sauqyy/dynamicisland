<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff" />
      <stop offset="0.55" stop-color="#a45bff" />
      <stop offset="1" stop-color="#ff7ac6" />
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d28" />
      <stop offset="1" stop-color="#050509" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#1a0040" flood-opacity="0.45" />
    </filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232" /></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="#050509" />
  <rect x="8" y="8" width="1008" height="1008" rx="226" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="4" />
  <!-- Astra's eyes: two four-point stars that blink -->
  <g transform="translate(512 512) scale(1.25) translate(-512 -512)" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round" filter="url(#halo)">
    <path transform-origin="360 512" d="M360 402 L385 487 L470 512 L385 537 L360 622 L335 537 L250 512 L335 487 Z">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1 1;1 .08;1 1;1 1" keyTimes="0;.88;.92;.96;1" dur="4s" repeatCount="indefinite" />
    </path>
    <path transform-origin="664 512" d="M664 402 L689 487 L774 512 L689 537 L664 622 L639 537 L554 512 L639 487 Z">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1;1 1;1 .08;1 1;1 1" keyTimes="0;.88;.92;.96;1" dur="4s" repeatCount="indefinite" />
    </path>
  </g>
</svg>

name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*', 'ui-v*']

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  # every file the app updates itself from is signed with this key; the app checks the signature
  # against src-tauri/updater.pub before it runs anything (see SECURITY.md)
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ui-v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes ${{ startsWith(github.ref_name, 'ui-v') && '--prerelease' || '' }}

  macos:
    needs: [release]
    if: always() && !startsWith(github.ref, 'refs/tags/ui-v') && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Refuse to build without the update signing key
        shell: bash
        run: |
          if grep -q REPLACE src-tauri/updater.pub || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set src-tauri/updater.pub and the TAURI_SIGNING_PRIVATE_KEY secret first (see SECURITY.md)"
            exit 1
          fi
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astra-isle-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="AstraIsle_${GITHUB_REF_NAME#v}_universal.dmg"
          cp "$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)" "$out"
          npx tauri signer sign "$out"
          gh release upload "$GITHUB_REF_NAME" "$out" "$out.sig" --clobber

  windows:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Refuse to build without the update signing key
        shell: bash
        run: |
          if grep -q REPLACE src-tauri/updater.pub || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set src-tauri/updater.pub and the TAURI_SIGNING_PRIVATE_KEY secret first (see SECURITY.md)"
            exit 1
          fi
      - run: npm ci
      - name: Build the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/ui-v') }}
        run: npx tauri build --bundles nsis
      - name: Build the Universitas Indonesia installer
        if: ${{ startsWith(github.ref, 'refs/tags/ui-v') }}
        run: npm run tauri:build:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astra-isle-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ui-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          case "$GITHUB_REF_NAME" in
            ui-v*) out="AstraIsleUI_${GITHUB_REF_NAME#ui-v}_x64-setup.exe" ;;
            *) out="AstraIsle_${GITHUB_REF_NAME#v}_x64-setup.exe" ;;
          esac
          cp "$f" "$out"
          npx tauri signer sign "$out"
          gh release upload "$GITHUB_REF_NAME" "$out" "$out.sig" --clobber
      - name: Build the custom Setup
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ui-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p setup/payload
          cp "$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)" setup/payload/installer.exe
          case "$GITHUB_REF_NAME" in
            ui-v*) ver="${GITHUB_REF_NAME#ui-v}"; feat="--features ui"; out="AstraIsleUI_Setup_${ver}.exe"; tdir=target-ui ;;
            *) ver="${GITHUB_REF_NAME#v}"; feat=""; out="AstraIsle_Setup_${ver}.exe"; tdir=target ;;
          esac
          sed -i "0,/^version = .*/s//version = \"$ver\"/" setup/Cargo.toml
          (cd setup && CARGO_TARGET_DIR="$tdir" cargo build --release $feat)
          cp "setup/$tdir/release/dynamic-island-setup.exe" "$out"
          gh release upload "$GITHUB_REF_NAME" "$out" --clobber

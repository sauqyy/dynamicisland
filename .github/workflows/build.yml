name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*', 'ui-v*']

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ui-v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes ${{ startsWith(github.ref_name, 'ui-v') && '--prerelease' || '' }}

  macos:
    needs: [release]
    if: always() && !startsWith(github.ref, 'refs/tags/ui-v') && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber

  windows:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/ui-v') }}
        run: npx tauri build --bundles nsis
      - name: Build the Universitas Indonesia installer
        if: ${{ startsWith(github.ref, 'refs/tags/ui-v') }}
        run: npm run tauri:build:ui
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/ui-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          case "$GITHUB_REF_NAME" in
            ui-v*) out="DynamicIslandUI_${GITHUB_REF_NAME#ui-v}_x64-setup.exe" ;;
            *) out="DynamicIsland_${GITHUB_REF_NAME#v}_x64-setup.exe" ;;
          esac
          cp "$f" "$out"
          gh release upload "$GITHUB_REF_NAME" "$out" --clobber

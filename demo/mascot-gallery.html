<meta charset="utf-8" />

<title>Mascot designs</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 20px 40px; background: #0b0b10; color: #e9e9f2; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 22px; color: #8b8ba0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; max-width: 1100px; }
  .card { background: linear-gradient(180deg, #16161f, #101017); border: 1px solid #23232f; border-radius: 22px; padding: 16px 12px 14px; text-align: center; }
  .card svg { width: 150px; height: 150px; display: block; margin: 0 auto 6px; animation: float 3.4s ease-in-out infinite; overflow: visible; }
  .card:nth-child(even) svg { animation-delay: -1.2s; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 34px; margin: 0 0 8px; background: #000; border-radius: 0 0 14px 14px; color: #fff; font-size: 12px; }
  .pill svg { width: 24px; height: 24px; margin: 0; animation: none; }
  .n { font-weight: 600; } .d { color: #8b8ba0; font-size: 12px; }
  @keyframes float { 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .card svg { animation: none; } }
</style>
</head>
